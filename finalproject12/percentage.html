<!DOCTYPE html>
<html lang="en">            
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percentage Value Calculator</title>
  <link rel="stylesheet" href="stylepercentage.css">
</head>
<body>


  <!-- 🧭 FIXED NAVBAR -->
  <nav>
    <div class="nav-left">
      <a href="index.html" class="home-btn" title="Go to Home">🏠 Home</a>
    </div>
    <div class="nav-right">
      <select id="menu" onchange="navigatePage()" title="Select a calculator">
        <option value="">☰ Menu</option>
        <option value="addition.html">Addition</option>
        <option value="subtraction.html">Subtraction</option>
        <option value="multiplication.html">Multiplication</option>
        <option value="division.html">Division</option>
        <option value="simpleinterest.html">Simple Interest</option>
        <option value="compoundinterest.html">Compound Interest</option>
        <option value="agecalculation.html">Age Calculator</option>
        <option value="daysconverter.html">Days Converter</option>
        <option value="profitloss.html">Profit & Loss</option>
        <option value="percentage.html">Percentage</option>
        <option value="conversion.html">Conversions</option>
        <option value="table.html">Multiplication Table</option>
      </select>
    </div>
  </nav>

  <div class="main">
    <div class="box">
      <h1>Find Percentage Value</h1>

      <div class="input-section">
        <label>Enter Percentage (%):</label>
        <input type="number" id="percentage" placeholder="e.g. 20">
      </div>

      <div class="input-section">
        <label>Enter Number:</label>
        <input type="number" id="number" placeholder="e.g. 150">
      </div>

      <button onclick="calculatePercentageValue()">Result</button>
    </div>

    <div class="output-box">
      <h2>Output</h2>
      <p id="result"></p>
    </div>
  </div>
  

  <script>
    function calculatePercentageValue() {
      const percent = parseFloat(document.getElementById("percentage").value);
      const number = parseFloat(document.getElementById("number").value);
      const result = document.getElementById("result");

      if (isNaN(percent) || isNaN(number) || percent < 0 || number < 0) {
        result.innerHTML = "⚠️ Please enter valid positive numbers.";
        return;
      }

      const value = (percent / 100) * number;

      result.innerHTML = `
        <b>Entered Percentage:</b> ${percent}%<br>
        <b>Number:</b> ${number}<br><hr>
        <b>Percentage Value:</b> ${value.toFixed(2)}
      `;
    }

    function navigatePage() {
      const menu = document.getElementById("menu");
      const page = menu.value;
      if (page) window.location.href = page;
    }
    
  </script>

</body>
</html>
